<!doctype html>
<html>

<head>
    <title>Course notes example code</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta http-equiv="Content-Language" content="en" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/main.css" rel="stylesheet" type="text/css">
</head>

<body>

    <div id="container">
        <div class="count step1">
            <span>1</span>
        </div>
        <h1>Personal Details</h1>
        <form action="18november.html" method="get">
            <div class="form-input">
                <label>Forename:</label>
                <input type="text" name="forename">
            </div>

            <div class="form-input">
                <label>Surname:</label>
                <input type="text" name="surname">
            </div>

            <div class="form-input">
                <label>Address:</label>
                <textarea name="address"></textarea>
            </div>
            <div class="form-input">
                <select name="menu">
                    <option name="country" value="de">Denmark</option>
                    <option name="country" value="ie" selected>Ireland</option>
                    <option name="country" value="us">United States</option>
                </select>
            </div>

            <div>
                <label>Talks:</label>
                <label>Web Development:</label>
                <input type="checkbox" name="talk" value="webdev">
                <label>Cyber Security:</label>
                <input type="checkbox" name="talk" value="cybersec">
                <label>Web Development:</label>
                <input type="checkbox" name="talk" value="greencomp">

            </div>
            <input id="submit" type="submit">
    </div>

    </form>


</body>

</html>
