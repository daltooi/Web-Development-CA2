<!doctype html>
<html>

<head>
    <title>Course notes example code</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta http-equiv="Content-Language" content="en" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/main.css" rel="stylesheet" type="text/css">
</head>

<body>

    <div id="container">
        <div class="count step2">
            <span>2</span>
        </div>
        <h1>Attendance</h1>
        <form>
            <div class="form-input">
                <label>Forename:</label>
                <input type="text" name="forename">
            </div>

            <div class="form-input">
                <label>Surname:</label>
                <input type="text" name="surname">
            </div>

            <div class="form-input">
                <label>Address:</label>
                <textarea name="address"></textarea>
            </div>
            <input type="text" id="forename">
            <input type="text" id="surname">
            <input type="text" id="country">
            <input id="submit" type="submit">
            <div class="card">
                <h2>Range Slider</h2>
                <div class="value-display" id="valueDisplay">0</div>
                <div class="slider-container">
                    <input type="range" id="rangeSlider" class="slider" min="0" max="10" value="0">
                </div>
            </div>
    </div>
    </form>
    <script>// Get the query string (everything after the ?)
        let params = new URLSearchParams(document.location.search);
        let forename = params.get("forename");
        let surname = params.get("surname");
        let address = params.get("address");
        let country = params.get("country");
        let talk = params.get("talk");
        console.log(forename, surname, address)
        document.getElementById("forename").value = forename
        document.getElementById("surname").value = surname
        document.getElementById("country").value = country
        // JavaScript to dynamically update the displayed value
        const rangeSlider = document.getElementById("rangeSlider");
        const valueDisplay = document.getElementById("valueDisplay");

        // Update display as the range slider value changes
        rangeSlider.addEventListener("input", () => {
            valueDisplay.textContent = rangeSlider.value;
        });
 
    </script>
</body>

</html>
