<head>

<!--
Additional Requirements for Physical Attendees Registration Form
-->

<body>

    <div id="container">
        <div class="count step2">
            <span>3</span>
        </div>
        <h1>Additional Requirements for Physical Attendees Registration</h1>
        <form action="formFour.html" method="get">
            <div class="form-input">
                <label for="photo">Photo:</label>
                <input type="file" id="photo" name="photo" for="photo" onchange="loadPhoto()">
            </div>
            <img id="photoPreview" src="">





            <input id="submit" type="submit" value="Continue">
        </form>

    </div>
    <script>
        function loadPhoto() 
        {
            input = document.getElementById("photo");
            photoName = "./images/" + input.files[0].name
            document.getElementById("photoPreview").src = photoName;

        }
    </script>
</body>

</html>
